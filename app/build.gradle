plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sr.pianostudio'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sr.pianostudio'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 不让 aapt 压缩 mp3，加快加载
    androidResources {
        noCompress 'mp3'
    }
}